cargo-features = ["profile-rustflags"]

[package]
name = "lychrel_base10_simd"
version = "0.1.0"
edition = "2024"
default-run = "lychrel_base10_simd"

[features]
no-verify = []

[dependencies]
compile-time = "0.2"
# rayon = "1.11.0"
affinity = "0.1"

[target.'cfg(target_family = "windows")'.dependencies]
windows = { version = "0", features = [
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
] }

memory-stats = "1.2"

[target.'cfg(target_family = "unix")'.dependencies]
rustix = "1"

[dev-dependencies]
rand = "0.9"

[profile.release]
strip = true
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1
lto = "fat"
panic = "abort"
rustflags = ["-Z", "fmt-debug=none"]

[profile.release.build-override]
strip = true
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1
rustflags = ["-Z", "fmt-debug=none"]

[profile.profiling]
inherits = "release"
strip = false
debug = true
rustflags = ["-C", "force-frame-pointers=yes"]

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true
debug-assertions = true
lto = false
rustflags = ["-C", "force-frame-pointers=yes"]


[profile.test]
inherits = "dev"
opt-level = 2
overflow-checks = true
debug-assertions = true
lto = true
rustflags = ["-C", "force-frame-pointers=yes"]
