[build]
rustflags = ["-C", "target-cpu=native", "-Z", "threads=16", "-Z", "build-std", "-Z", "unsound-mir-opts", "-C", "panic=abort", "-C", "lto=fat", "-Z", "unstable-options", "-C", "embed-bitcode=yes", "-Z", "dylib-lto=true", "-C", "prefer-dynamic=false", "-C", "linker-plugin-lto", "-Zshare-generics=y", "-C", "llvm-args=--extra-vectorizer-passes --denormal-fp-math=positive-zero -enable-no-nans-fp-math -enable-no-signed-zeros-fp-math", "-Z", "next-solver"]

[unstable]
build-std = ["core", "std", "alloc", "proc_macro", "panic_abort"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=native", "-Z", "unsound-mir-opts", "-C", "panic=abort", "-Z", "threads=16", "-Z", "unstable-options", "-Z", "fmt-debug=none", "-Z", "panic_abort_tests", "-C", "lto=fat", "-C", "embed-bitcode=yes", "-Z", "dylib-lto=true", "-C", "prefer-dynamic=false", "-C", "linker-plugin-lto", "-Zshare-generics=y", "-C", "llvm-args=--extra-vectorizer-passes --denormal-fp-math=positive-zero"]
linker = "rust-lld.exe"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native", "-Z", "unsound-mir-opts", "-C", "panic=abort", "-Z", "threads=16", "-Z", "unstable-options", "-Z", "fmt-debug=none", "-Z", "panic_abort_tests", "-C", "lto=fat", "-C", "embed-bitcode=yes", "-Z", "dylib-lto=true", "-C", "prefer-dynamic=false", "-C", "linker-plugin-lto", "-Zshare-generics=y", "-C", "llvm-args=--extra-vectorizer-passes --denormal-fp-math=positive-zero"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native", "-Z", "unsound-mir-opts", "-C", "panic=abort", "-Z", "threads=16", "-Z", "unstable-options", "-Z", "fmt-debug=none", "-Z", "panic_abort_tests", "-C", "lto=fat", "-C", "embed-bitcode=yes", "-Z", "dylib-lto=true", "-C", "prefer-dynamic=false", "-Zshare-generics=y", "-C", "llvm-args=--extra-vectorizer-passes"]
