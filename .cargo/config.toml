# Flags here apply to *every* compilation unit: this crate, all dependencies,
# build scripts/proc macros, and the build-std copies of core/std/alloc.
#
# Anything that differs per profile (LTO, panic strategy, opt-level, codegen
# units, debug info, crt-static) lives in Cargo.toml instead -- cargo derives
# those from the profile and passing them here would clobber the profile and
# apply them to build scripts too.
#
# NOTE: a `[target.<triple>].rustflags` table *replaces* `[build].rustflags`
# rather than appending to it, so the target tables below deliberately carry no
# rustflags of their own.
[build]
rustflags = [
    # Zen 5 (znver5) on this machine. Must be set globally so build-std's core
    # and std are compiled with AVX-512 too.
    "-C", "target-cpu=native",
    # Parallel rustc frontend.
    "-Z", "threads=16",
    # Enables MIR optimizations that are known to be occasionally unsound.
    # Deliberate: this is a compute kernel and the wins are worth the risk.
    "-Z", "unsound-mir-opts",
    # Extra LLVM vectorizer runs, plus flush-to-zero denormals for the (float)
    # rate/statistics reporting math. The integer kernels are unaffected.
    #
    # The old config also carried -enable-no-nans-fp-math and
    # -enable-no-signed-zeros-fp-math. LLVM 23 no longer accepts either as a
    # command-line option (they are function attributes now) and rustc hard
    # errors on them, so they are gone. They were never actually in effect:
    # they only ever appeared in `[build]`, which the per-target tables
    # overrode. src/main.rs already gets nnan/nsz where it matters via the
    # fmul_fast/fdiv_fast intrinsics.
    "-C", "llvm-args=--extra-vectorizer-passes",
    "-C", "llvm-args=--denormal-fp-math=positive-zero",
]

[unstable]
build-std = ["core", "std", "alloc", "proc_macro", "panic_abort"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
