[build]
rustflags = ["-C", "target-cpu=native", "-Z", "threads=16", "-C", "target-feature=+crt-static", "-C", "lto=fat", "-C", "embed-bitcode=yes", "-Z", "dylib-lto=true", "-C", "prefer-dynamic=false", "-C", "linker-plugin-lto"]

[unstable]
build-std = ["core", "std", "alloc", "proc_macro", "panic_abort"]
build-std-features = ["panic_immediate_abort"]

[target.x86_64-pc-windows-msvc]
# rustflags = ["-C", "target-cpu=native", "-Z", "threads=16", "-Z", "fmt-debug=none", "-C", "lto=fat", "-C", "embed-bitcode=yes", "-Z", "dylib-lto=true"]
rustflags = ["-C", "target-cpu=native", "-C", "panic=abort", "-Z", "threads=16", "-Z", "fmt-debug=none", "-Z", "panic_abort_tests", "-C", "target-feature=+crt-static", "-C", "lto=fat", "-C", "embed-bitcode=yes", "-Z", "dylib-lto=true", "-C", "prefer-dynamic=false", "-C", "linker-plugin-lto", "-Zshare-generics=y"]
linker = "rust-lld.exe"
